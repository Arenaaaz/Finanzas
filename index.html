async function hash(p,s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s+p)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}}

async function chk(p){if(auth.v==2){try{return await hash2(p,auth.s)==auth.h}catch(e){return false}}return await hash(p,auth.s)==auth.h}
