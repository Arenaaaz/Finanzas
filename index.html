.pk{width:76px;height:76px;border-radius:50%;font-size:29px;font-weight:500;display:grid;place-items:center;background:linear-gradient(145deg,var(--gl1),var(--gl2));-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--gb);box-shadow:0 6px 16px var(--gs),inset 0 1px 0 var(--gh);transition:transform .1s,background .1s;color:var(--tx)}
.pk:active{transform:scale(.92);background:color-mix(in srgb,var(--ac) 24%,transparent)}.pk svg{color:var(--mu)}
</style></head>
<body><div id="app"></div><div id="dockhost"></div><div id="shield" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" style="width:56px;height:56px;color:var(--ac)"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
<script>
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const TY={g:'Gasto',i:'Ingreso',r:'Retiro',d:'Depósito',t:'Enviar'};
const TYX={...TY,v:'Inversión',q:'Retorno de inversión'};
const CATS={i:['Ventas','Salario','Otros'],g:['Comida','Transporte','Hogar','Servicios','Salud','Ocio','Compras','Inventario','Deudas','Otros']};
const COL=['#007aff','#34c759','#ff9500','#af52de','#ff2d55','#5ac8fa','#ffcc00','#8e8e93','#30b0c7'];
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const validDate=s=>{if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T12:00:00');return !Number.isNaN(d.getTime())&&d.getFullYear()===+s.slice(0,4)&&d.getMonth()+1===+s.slice(5,7)&&d.getDate()===+s.slice(8,10)};
let S={txs:[],biz:[],fijos:[],deudas:[],inv:[]},fx=null,auth,tab='inicio',mon=today().slice(0,7),fb='*',sheet=null,ok=false,loaded=false,status='',hid=0,sessionSecret=null,sessionCryptoKey=null,sessionCryptoPass=null,sessionCryptoSalt=null,saveQueue=Promise.resolve();
let swap=0,dbt=null,ivt=null,rng=6,bsec='res',nsec='neg',pg=null,bcfg=false,chg=false,pin='',su={type:'pin',len:6,val:'',p1:'',step:1},anim=0,fxw='*',toast=null,hide=LS.get('fin_oculto')||false,fails=0,lockUntil=0,q='',tf='*',tt;
const fmn=n=>n?new Intl.NumberFormat('es-CO').format(n):'';
const fmc=n=>{const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(a>=1e7?0:1).replace('.',',')+'M':a>=1e3?Math.round(n/1e3)+'k':String(n)};
function showToast(m,u){toast={m,u};draw();clearTimeout(tt);tt=setTimeout(()=>{toast=null;const e=$('#toast');if(e)e.remove()},u?6000:3500)}
const toastV=()=>toast?`<div id="toast" class="toast" role="status"><span>${toast.m}</span>${toast.u?'<button data-a="undo">Deshacer</button>':''}</div>`:'';
const shield=on=>{const e=$('#shield');if(e)e.style.display=on?'grid':'none'};
async function backup(){const n='finanzas-respaldo-'+today()+'.json',t=JSON.stringify({v:2,txs:S.txs,biz:S.biz,fijos:S.fijos||[],deudas:S.deudas||[],inv:S.inv||[],budget:LS.get('fin_pres')||0});
  try{const f=new File([t],n,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});LS.set('fin_copia',Date.now());draw();return}}catch(e){if(e&&e.name=='AbortError')return}
  dl(n,t,'application/json');LS.set('fin_copia',Date.now());draw()}

const shift=(m,n)=>{const d=new Date(m+'-15T12:00');d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const mlab=(m,o)=>new Date(m+'-15T12:00').toLocaleDateString('es-CO',o||{month:'long',year:'numeric'});
const allBiz=()=>['Personal',...S.biz.map(b=>b.n)];
const flt=()=>S.txs.filter(t=>fb=='*'||(t.b||'Personal')==fb);
function bal(w){let b=0,e=0;const add=(f,x)=>{f=='e'?e+=x:b+=x};
  for(const t of S.txs){const o=t.b||'Personal';
    if(t.t=='i'&&o==w)add(t.f,t.a);else if(t.t=='g'&&o==w)add(t.f,-t.a);
    else if(t.t=='r'&&o==w){b-=t.a;e+=t.a}else if(t.t=='d'&&o==w){e-=t.a;b+=t.a}
    else if(t.t=='v'&&o==w)add(t.f,-t.a);else if(t.t=='q'&&o==w)add(t.f,t.a)
    else if(t.t=='t'){if(o==w)add(t.f,-t.a);if(t.to==w)add(t.h,t.a)}}
  return{b,e}}
/* Entradas y salidas del mes por cuenta (Banco/Efectivo) de una cartera. Incluye retiros, depósitos y envíos entre carteras,
   de modo que (entró − salió) de cada cuenta coincide con lo que cambió su saldo en bal(). */
function flows(w,m){const r={b:{i:0,o:0},e:{i:0,o:0}};
  for(const t of S.txs){if(t.d.slice(0,7)!=m)continue;const o=t.b||'Personal',a=t.f=='e'?'e':'b';
    if(o==w){if(t.t=='i')r[a].i+=t.a;else if(t.t=='g')r[a].o+=t.a;else if(t.t=='r'){r.b.o+=t.a;r.e.i+=t.a}else if(t.t=='d'){r.e.o+=t.a;r.b.i+=t.a}else if(t.t=='t')r[a].o+=t.a;else if(t.t=='v')r[a].o+=t.a;else if(t.t=='q')r[a].i+=t.a}
    if(t.t=='t'&&t.to==w)r[t.h=='e'?'e':'b'].i+=t.a}
  return r}
/* Resumen del mes de una cartera: todo lo que entró y salió de su dinero (sin contar retiros/depósitos, que son internos).
   i = ingresos + traslados recibidos + retornos de inversión; o = gastos + traslados enviados + inversiones. net = i - o. */
function mflow(w,m){const r={ri:0,rg:0,tin:0,tout:0,vo:0,vr:0};
  for(const t of S.txs){if(m&&t.d.slice(0,7)!=m)continue;const o=t.b||'Personal';
    if(o==w){if(t.t=='i')r.ri+=t.a;else if(t.t=='g')r.rg+=t.a;else if(t.t=='t')r.tout+=t.a;else if(t.t=='v')r.vo+=t.a;else if(t.t=='q')r.vr+=t.a}
    if(t.t=='t'&&t.to==w)r.tin+=t.a}
  r.i=r.ri+r.tin+r.vr;r.o=r.rg+r.tout+r.vo;r.net=r.i-r.o;return r}
function sums(l,m){let i=0,g=0;for(const t of l)if(t.d.slice(0,7)==m){if(t.t=='i')i+=t.a;if(t.t=='g')g+=t.a}return{i,g}}

/* ---------- almacenamiento y cifrado local ---------- */
const hexBytes=h=>new Uint8Array((h.match(/.{1,2}/g)||[]).map(x=>parseInt(x,16)));
const randomHex=n=>{const b=new Uint8Array(n);crypto.getRandomValues(b);return [...b].map(x=>x.toString(16).padStart(2,'0')).join('')};
async function dataKey(pass,saltHex){if(sessionCryptoKey&&sessionCryptoPass===pass&&sessionCryptoSalt===saltHex)return sessionCryptoKey;const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);sessionCryptoKey=await crypto.subtle.deriveKey({name:'PBKDF2',salt:hexBytes(saltHex),iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);sessionCryptoPass=pass;sessionCryptoSalt=saltHex;return sessionCryptoKey}
async function persistEncrypted(raw,pass=sessionSecret,a=auth){
  if(!a||!pass||!crypto.subtle)throw new Error('No hay una sesión criptográfica disponible');
  if(!a.encSalt)a.encSalt=randomHex(16);
  const key=await dataKey(pass,a.encSalt),iv=crypto.getRandomValues(new Uint8Array(12));
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(raw));
  localStorage.setItem('fin_datos_enc',JSON.stringify({v:1,iv:[...iv].map(x=>x.toString(16).padStart(2,'0')).join(''),data:[...new Uint8Array(cipher)].map(x=>x.toString(16).padStart(2,'0')).join('')}));
  localStorage.removeItem('fin_datos');LS.set('fin_acceso',a);
}
async function unlockData(pass){
  sessionSecret=pass;
  const raw=localStorage.getItem('fin_datos_enc');
  if(raw){
    if(!crypto.subtle)throw new Error('Este navegador no permite descifrar los datos. Abre la app en un contexto seguro.');
    const box=JSON.parse(raw);if(box.v!==1||!box.iv||!box.data||!auth.encSalt)throw new Error('Copia cifrada inválida');
    const key=await dataKey(pass,auth.encSalt),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:hexBytes(box.iv)},key,hexBytes(box.data));
    const d=JSON.parse(new TextDecoder().decode(plain));S=normaliseData(d);
  }else{
    const legacy=LS.get('fin_datos');if(legacy)S=normaliseData(legacy);
    if(crypto.subtle){if(!auth.encSalt)auth.encSalt=randomHex(16);await persistEncrypted(JSON.stringify(S));}
  }
}
function normaliseData(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.txs))return {txs:[],biz:[],fijos:[],deudas:[],inv:[]};
  return {txs:d.txs,biz:(Array.isArray(d.biz)?d.biz:[]).map(b=>typeof b==='string'?{n:b}:b).filter(b=>b&&typeof b.n==='string'),fijos:Array.isArray(d.fijos)?d.fijos:[],deudas:Array.isArray(d.deudas)?d.deudas:[],inv:Array.isArray(d.inv)?d.inv:[]};
}
function save(){
  const raw=JSON.stringify(S);
  if(auth&&sessionSecret&&crypto.subtle){const pass=sessionSecret,a=JSON.parse(JSON.stringify(auth));saveQueue=saveQueue.then(()=>persistEncrypted(raw,pass,a)).catch(()=>{showToast('No se pudieron guardar los datos cifrados. Exporta una copia y revisa el almacenamiento del navegador.',true)});}
  else if(!auth||(!crypto.subtle&&sessionSecret)){try{localStorage.setItem('fin_datos',raw)}catch(e){showToast('No se pudo guardar. Exporta una copia de seguridad.',true)}}
  else showToast('Sesión sin clave de cifrado: vuelve a desbloquear la app antes de modificar datos.',true);
}
async function load(){
  auth=LS.get('fin_acceso');
  if(!localStorage.getItem('fin_datos_enc')){const l=LS.get('fin_datos');if(l)S=normaliseData(l)}
  applyTheme();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  loaded=true;draw();
}

/* ---------- contraseña ---------- */
async function hash(p,s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s+p)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}}
async function hash2(p,s){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(s),iterations:150000,hash:'SHA-256'},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function chk(p){if(auth.v==2){try{return await hash2(p,auth.s)==auth.h}catch(e){return false}}return await hash(p,auth.s)==auth.h}
async function setPass(p,type,len){await saveQueue.catch(()=>{});const s=randomHex(16),ty=type||'pass',ln=len||0;try{auth={s,v:2,h:await hash2(p,s),type:ty,len:ln,encSalt:randomHex(16)}}catch(e){auth={s,h:await hash(p,s),type:ty,len:ln}}sessionSecret=p;LS.set('fin_acceso',auth);if(crypto.subtle){await persistEncrypted(JSON.stringify(S))}else{try{localStorage.setItem('fin_datos',JSON.stringify(S))}catch(e){showToast('No se pudo guardar. Exporta una copia.',true)}}}
let lockErr='';
const dots=(n,len)=>`<div class="dts">${Array.from({length:len},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`;
const padV=()=>`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pk" data-a="pk" data-v="${n}">${n}</button>`).join('')}<span></span><button class="pk" data-a="pk" data-v="0">0</button><button class="pk" data-a="pdel" aria-label="Borrar">${I('back',26)}</button></div>`;
function setupBody(inSheet){const u=su,pm=u.type=='pin';
  return `<div class="lock"${inSheet?' style="min-height:0;padding-top:4px"':''}>${inSheet?'':`<div class="lockic">${I('lock',34)}</div>`}<h1 style="margin:0;font-size:${inSheet?24:33}px">${u.step==2?'Confirma tu '+(pm?'PIN':'contraseña'):(auth?'Elige tu nuevo acceso':'Crea tu acceso')}</h1>
${u.step==1?`<p class="mu">${pm?'Un PIN numérico: solo verás números.':'Mínimo 4 caracteres.'}</p>${segV([['pin','PIN numérico'],['pass','Contraseña']],u.type,'sutype',null,'margin:4px 0 0')}${pm?segV([['4','4 dígitos'],['6','6 dígitos']],String(u.len),'sulen',null,'margin:0'):''}`:'<p class="mu">Escríbelo otra vez para confirmar.</p>'}
${pm?`${dots(u.val.length,u.len)}${lockErr?`<div class="rd">${lockErr}</div>`:''}${padV()}`:`<input id="p1" type="password" placeholder="Contraseña" autocomplete="new-password"><input id="p2" type="password" placeholder="Repite la contraseña">${lockErr?`<div class="rd">${lockErr}</div>`:''}<button class="btn" data-a="create">Guardar${auth?'':' y entrar'}</button>`}</div>`}
const chgV=()=>`<div class="ov"><div class="bk${anim?' in':''}" data-a="chgclose"></div><div class="sh${anim?' in':''}"><div class="shh"><button class="lk" data-a="chgclose">Cancelar</button><b>Cambiar acceso</b><span style="width:64px"></span></div>${setupBody(true)}</div></div>`;
function lockV(){if(!auth)return setupBody(false);
  if(auth.type=='pin')return `<div class="lock"><div class="lockic">${I('lock',34)}</div><h1 style="margin:0">Mis Finanzas</h1><p class="mu">Ingresa tu PIN</p>${dots(pin.length,auth.len)}${lockErr?`<div class="rd">${lockErr}</div>`:''}${padV()}</div>`;
  return `<div class="lock"><div class="lockic">${I('lock',34)}</div><h1 style="margin:0">Mis Finanzas</h1><p class="mu">Ingresa tu contraseña</p><input id="p1" type="password" autofocus placeholder="Contraseña" autocomplete="current-password">${lockErr?`<div class="rd">${lockErr}</div>`:''}<button class="btn" data-a="unlock">Entrar</button></div>`}
async function pkAdd(d){if(Date.now()<lockUntil){lockErr='Espera '+Math.ceil((lockUntil-Date.now())/1000)+' s.';draw();return}
  if(!auth||chg){if(su.val.length>=su.len)return;su.val+=d;lockErr='';draw();if(su.val.length==su.len){await new Promise(r=>setTimeout(r,130));
    if(su.step==1){su.p1=su.val;su.val='';su.step=2;draw()}
    else if(su.val==su.p1){await setPass(su.val,'pin',su.len);lockErr='';ok=true;const c=chg;chg=false;su={type:'pin',len:6,val:'',p1:'',step:1};if(c)showToast('PIN actualizado');else draw()}
    else{lockErr='Los PIN no coinciden. Inténtalo de nuevo.';su.val='';su.p1='';su.step=1;draw()}}return}
  if(pin.length>=auth.len)return;pin+=d;lockErr='';draw();
  if(pin.length==auth.len){await new Promise(r=>setTimeout(r,130));const p=pin;pin='';if(await chk(p)){try{await unlockData(p);ok=true;lockErr='';fails=0}catch(err){sessionSecret=null;sessionCryptoKey=null;sessionCryptoPass=null;sessionCryptoSalt=null;lockErr='No se pudieron abrir los datos. Comprueba el PIN o recupera una copia.'}}else{fails++;lockErr='PIN incorrecto.';if(fails>=5){lockUntil=Date.now()+30000*(fails-4);lockErr='Demasiados intentos. Espera 30 s.'}}draw()}}
function pkDel(){if(!auth||chg)su.val=su.val.slice(0,-1);else pin=pin.slice(0,-1);draw()}

/* ---------- vistas ---------- */
const ICO={inicio:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',movs:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',neg:'<path d="M3 9l1-5h16l1 5M4 9v11h16V9M9 20v-6h6v6"/>',graf:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',ajus:'<path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M20 18h0"/>'};
const NAMES={inicio:'Inicio',movs:'Historial',neg:'Negocios',graf:'Gráficas',ajus:'Ajustes',fijos:'Fijos',deudas:'Deudas'},TABS=['inicio','movs','neg','graf','ajus'];
const segV=(items,cur,act,key,st)=>{const ix=Math.max(0,items.findIndex(([k])=>k==cur));return `<div class="seg" style="--n:${items.length};--i:${ix};${st||''}"><i class="thumb"></i>${items.map(([k,l],i)=>`<button class="${k==cur?'on':''}" data-a="${act}" ${key?`data-k="${key}" `:''}data-v="${esc(k)}" data-i="${i}">${l}</button>`).join('')}</div>`};

const navHl=()=>(tab=='fijos'||tab=='deudas')?'inicio':tab;
const indTf=i=>`translateX(${i*100}%) translateX(${i*2}px)`;
function dockV(){const hl=navHl(),i=TABS.indexOf(hl),aj=tab=='ajus';
  return `<div class="dock ${aj?'no-plus':''}"><nav class="tb" aria-label="Navegación principal"><i class="tb-indicator" aria-hidden="true" style="transform:${indTf(i)}"></i>${TABS.map(k=>`<button class="${hl==k?'on':''}" data-a="tab" data-v="${k}" aria-current="${hl==k?'page':'false'}"><svg class="i" viewBox="0 0 24 24">${ICO[k]}</svg><span>${NAMES[k]}</span></button>`).join('')}</nav><button class="plus ${aj?'is-hidden':''}" data-a="menu" aria-label="Nuevo" ${aj?'tabindex="-1" aria-hidden="true"':''}>${I('plus',26)}</button></div>`}
// La barra se crea una sola vez y después solo se actualiza en sitio: así las transiciones CSS
// (selector deslizante, botón +) corren sobre el mismo elemento y nunca se superponen dos copias.
function syncDock(show){const h=$('#dockhost');if(!h)return;
  if(!show){if(h.firstChild)h.innerHTML='';return}
  const d=h.querySelector('.dock');if(!d){h.innerHTML=dockV();return}
  const hl=navHl(),i=TABS.indexOf(hl),aj=tab=='ajus';
  d.classList.toggle('no-plus',aj);
  d.querySelectorAll('.tb button').forEach(b=>{const on=b.dataset.v==hl;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')});
  const ind=d.querySelector('.tb-indicator');if(ind)ind.style.transform=indTf(i);
  const p=d.querySelector('.plus');if(p){p.classList.toggle('is-hidden',aj);if(aj){p.setAttribute('tabindex','-1');p.setAttribute('aria-hidden','true')}else{p.removeAttribute('tabindex');p.removeAttribute('aria-hidden')}}}
